server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page shell so a rebuild is picked up straight away
    # (the JS/CSS it points to have hashed names and are cached for a year below).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend container
    location /api/ {
        # Look the backend up through Docker's DNS on each use (cached 10s) rather than
        # once at startup, so recreating the backend container never leaves nginx
        # pointing at its old address.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
